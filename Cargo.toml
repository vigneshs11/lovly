[package]
name = "lovlydb"
version = "0.1.0"
edition = "2021"
authors = ["LovlyDB"]
description = "Browser-native SIMD HNSW vector search (Rust → WASM)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/lovlydb"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
